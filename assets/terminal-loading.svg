<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="'Fira Code','Cascadia Code',Consolas,monospace">
  <rect x="2" y="2" width="796" height="356" rx="14" fill="#0d1117" stroke="#00ff41" stroke-width="2"/>

  <!-- title bar -->
  <rect x="2" y="2" width="796" height="44" rx="14" fill="#161b22"/>
  <rect x="2" y="30" width="796" height="16" fill="#161b22"/>
  <circle cx="28" cy="24" r="8" fill="#ff5f56"/>
  <circle cx="52" cy="24" r="8" fill="#ffbd2e"/>
  <circle cx="76" cy="24" r="8" fill="#27c93f"/>
  <text x="400" y="30" text-anchor="middle" font-size="15" fill="#8b949e">theani7@ai: ~/boot.sh</text>

  <!-- body -->
  <g font-size="16" fill="#00ff41">
    <!-- line 1 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.3s" fill="freeze"/>
      <text x="28" y="80"><tspan fill="#7ee787">$</tspan> sudo boot profile --full-terminal</text>
    </g>
    <!-- line 2 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.3s" fill="freeze"/>
      <text x="28" y="110"><tspan fill="#27c93f">[ OK ]</tspan> kernel loaded ........ v6.9-ai</text>
    </g>
    <!-- line 3 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.3s" fill="freeze"/>
      <text x="28" y="140"><tspan fill="#27c93f">[ OK ]</tspan> mounting /dev/llms ... done</text>
    </g>
    <!-- line 4 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.3s" fill="freeze"/>
      <text x="28" y="170"><tspan fill="#27c93f">[ OK ]</tspan> starting agentd ...... done</text>
    </g>
    <!-- line 5 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.3s" fill="freeze"/>
      <text x="28" y="200"><tspan fill="#27c93f">[ OK ]</tspan> portfolio ............ anilpaneru.com.np</text>
    </g>

    <!-- progress bar frame -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.3s" fill="freeze"/>
      <text x="28" y="235">loading modules [</text>
      <text x="668" y="235">]</text>
      <rect x="208" y="222" width="452" height="14" rx="4" fill="none" stroke="#30363d" stroke-width="1.5"/>
    </g>
    <!-- progress bar fill -->
    <rect x="211" y="225" width="0" height="8" rx="2" fill="#00ff41">
      <animate attributeName="width" from="0" to="446" begin="3.8s" dur="2.2s" fill="freeze"/>
    </rect>

    <!-- done line -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="6.1s" dur="0.4s" fill="freeze"/>
      <text x="28" y="270"><tspan fill="#27c93f">[DONE]</tspan> status: OPEN_TO_WORK // Kathmandu → remote</text>
    </g>

    <!-- prompt + blinking cursor -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="6.6s" dur="0.3s" fill="freeze"/>
      <text x="28" y="310"><tspan fill="#7ee787">theani7@ai:~$</tspan> _</text>
      <rect x="218" y="296" width="11" height="19" fill="#00ff41">
        <animate attributeName="opacity" values="1;0;1;1" keyTimes="0;0.4;0.6;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
